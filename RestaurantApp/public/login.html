<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">

  <title>Autentificare — Flavour House</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 2rem;
      margin: 0;
      background: linear-gradient(rgba(44, 26, 14, 0.75), rgba(44, 26, 14, 0.75)), 
                  url('https://media.gettyimages.com/id/1632045436/video/defocus-after-work-dinner-party.jpg?s=640x640&k=20&c=yxpzzxIzMyTx0dXF350Sa_MqFmlVjyDskMo8bTIoD7I=');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .auth-wrapper {
      display: grid; grid-template-columns: 1fr 1fr;
      max-width: 900px; width: 100%;
      border-radius: var(--radius-lg);
      overflow: hidden; box-shadow: var(--shadow-lg);
      background: var(--alb);
    }

    .auth-banner {
      background: linear-gradient(160deg, var(--maro) 0%, var(--maro-med) 100%);
      padding: 3rem 2.5rem; display: flex; flex-direction: column; 
      justify-content: center; align-items: center; text-align: center;
      position: relative; overflow: hidden;
    }

    .auth-banner::before {
      content: '🍽️'; font-size: 12rem; position: absolute;
      right: -2rem; bottom: -2rem; opacity: 0.08; line-height: 1;
    }

    .auth-banner-logo {
      height: 120px;
      width: auto;
      object-fit: contain;
      margin-bottom: 2rem;
    }

    .auth-banner-label {
      font-size: 13px; font-weight: 500; letter-spacing: 0.2em;
      color: var(--auriu); text-transform: uppercase; margin-bottom: 1rem;
    }

    .auth-banner h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem; color: var(--crem); line-height: 1.3; margin-bottom: 1rem;
    }

    .auth-banner p { font-size: 16px; color: rgba(245,240,232,0.65); }

    .auth-form-side { background: var(--alb); padding: 3rem 2.5rem; }

    .auth-logo {
      font-family: 'Playfair Display', serif; font-size: 1.8rem;
      color: var(--maro); margin-bottom: 2rem; display: block;
    }

    .auth-logo span { color: var(--auriu); }

    .auth-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--maro); margin-bottom: 0.4rem; }

    .auth-sub { font-size: 14px; color: var(--gri); margin-bottom: 2rem; }

    .auth-footer { margin-top: 1.5rem; text-align: center; font-size: 14px; color: var(--gri); }

    .auth-footer a { color: var(--auriu); text-decoration: none; font-weight: 500; }

    .auth-footer a:hover { text-decoration: underline; }

    /* Buton Google */
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 11px 22px; border-radius: var(--radius);
      border: 1.5px solid var(--gri-light); background: var(--alb);
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      color: var(--maro); cursor: pointer; text-decoration: none;
      transition: all var(--transition);
      box-sizing: border-box;
    }
    .btn-google:hover {
      border-color: #4285F4; background: #F8F9FF;
      box-shadow: 0 2px 12px rgba(66,133,244,0.15);
    }
    .google-icon { width: 18px; height: 18px; flex-shrink: 0; }

    /* Separator */
    .separator {
      display: flex; align-items: center; gap: 12px;
      margin: 1.2rem 0; color: var(--gri); font-size: 13px;
    }
    .separator::before, .separator::after {
      content: ''; flex: 1; height: 1px; background: var(--gri-light);
    }

    @media (max-width: 640px) {
      .auth-wrapper { grid-template-columns: 1fr; max-width: 450px; }
      .auth-banner { display: none; }
    }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-banner">
    <img src="logo.png" alt="Logo Flavour House" class="auth-banner-logo">
    <p class="auth-banner-label">Bun venit înapoi</p>
    <h2>O masă te așteaptă</h2>
    <p>Autentifică-te pentru a gestiona rezervările tale și a descoperi preparatele noastre.</p>
  </div>
  <div class="auth-form-side">
    <a href="index.html" class="auth-logo">Flavour <span>House</span></a>
    <h2 class="auth-title">Autentificare</h2>
    <p class="auth-sub">Introdu datele contului tău</p>

    <div id="alert" class="alert"></div>

    <a href="/api/auth/google" class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuă cu Google
    </a>

    <div class="separator">sau</div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="exemplu@mail.com">
    </div>
    <div class="form-group">
      <label>Parolă</label>
      <input type="password" id="parola" placeholder="••••••••">
    </div>
    <button class="btn btn-dark btn-full" onclick="login()">Intră în cont</button>

    <div class="auth-footer">
      Nu ai cont? <a href="register.html">Înregistrează-te</a>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('error') === 'google') {
  const alertEl = document.getElementById('alert');
  alertEl.className = 'alert alert-error show';
  alertEl.textContent = 'Autentificarea cu Google a esuat. Incearca din nou.';
}

if (localStorage.getItem('token')) {
  const u = JSON.parse(localStorage.getItem('utilizator') || '{}');
  window.location.href = u.rol === 'admin' ? 'admin/dashboard.html' : 'rezervarile-mele.html';
}

async function login() {
  const email  = document.getElementById('email').value.trim();
  const parola = document.getElementById('parola').value;
  const alert  = document.getElementById('alert');

  alert.className = 'alert'; alert.textContent = '';

  if (!email || !parola) {
    alert.className = 'alert alert-error show';
    alert.textContent = 'Completează toate câmpurile.';
    return;
  }

  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, parola })
    });
    const date = await res.json();

    if (!res.ok) {
      alert.className = 'alert alert-error show';
      alert.textContent = date.mesaj;
      return;
    }

    localStorage.setItem('token', date.token);
    localStorage.setItem('utilizator', JSON.stringify(date.utilizator));

    alert.className = 'alert alert-success show';
    alert.textContent = 'Autentificare reușită! Se redirecționează...';

    setTimeout(() => {
      window.location.href = date.utilizator.rol === 'admin'
        ? 'admin/dashboard.html'
        : 'rezervarile-mele.html';
    }, 800);
  } catch (e) {
    alert.className = 'alert alert-error show';
    alert.textContent = 'Eroare de conexiune. Încearcă din nou.';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
